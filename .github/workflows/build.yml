name: Minuvex build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B out/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build C++ and HLSL/Metal shaders
        run: cmake --build out/ci --config ${{ matrix.configuration }} --parallel
      - name: CPU regression tests (desktop smoke is opt-in)
        run: ctest --test-dir out/ci --build-config ${{ matrix.configuration }} --output-on-failure
      - name: Install, relocate and verify an independent SDK consumer
        run: cmake -DBUILD_DIR=out/ci -DCONFIG=${{ matrix.configuration }} -P cmake/VerifySdk.cmake
      - name: Build platform SDK archive (Release only)
        if: matrix.configuration == 'Release'
        run: cpack --config out/ci/CPackConfig.cmake -C Release
      - name: Retain SDK archives and checksums (Release only)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Minuvex-SDK-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/ci/packages/*.zip
            out/ci/packages/*.tar.gz
            out/ci/packages/*.sha256
          if-no-files-found: error
      - name: Validate benchmark and AI evaluation tools (Windows Release only)
        if: runner.os == 'Windows' && matrix.configuration == 'Release'
        shell: pwsh
        run: ./tests/Release/ToolChecks.ps1 -OutputRoot out/tool-checks
