name: Minuvex build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B out/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build C++ and HLSL/Metal shaders
        run: cmake --build out/ci --config ${{ matrix.configuration }} --parallel
      - name: Core, Asset and Scene tests (no desktop or GPU required)
        run: ctest --test-dir out/ci --build-config ${{ matrix.configuration }} --output-on-failure
