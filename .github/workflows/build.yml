name: Minuvex build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B out/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build C++ and HLSL/Metal shaders
        run: cmake --build out/ci --config ${{ matrix.configuration }} --parallel
      - name: Core, Asset, Scene, Result and Viewer CPU tests
        run: ctest --test-dir out/ci --build-config ${{ matrix.configuration }} --output-on-failure
      - name: Configure an external SDK consumer
        run: cmake -S tests/Consumer -B out/consumer -DMINUVEX_SOURCE_DIR="${{ github.workspace }}" -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DFETCHCONTENT_SOURCE_DIR_SOKOL="${{ github.workspace }}/out/ci/_deps/sokol-src"
      - name: Build public Viewer API consumer (no desktop required)
        run: cmake --build out/consumer --config ${{ matrix.configuration }} --parallel
