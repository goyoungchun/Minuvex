name: Minvex build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git out/emsdk
          ./out/emsdk/emsdk install 4.0.10
          ./out/emsdk/emsdk activate 4.0.10
      - name: Build WebGL2 module
        run: |
          source ./out/emsdk/emsdk_env.sh
          emcmake cmake -S . -B out/web-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build out/web-ci --target minvex_web --parallel 4
          cmake --install out/web-ci --prefix out/web-package --component web
      - name: Browser rendering and lifecycle checks
        env:
          MINVEX_WEB_DIR: out/web-ci/web
          MINVEX_BROWSERS: chromium
        run: |
          npm --prefix web install --ignore-scripts --no-audit --no-fund
          cd web
          npx playwright install --with-deps chromium
          cd ..
          node web/tests/browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Minvex-WebAssembly
          path: out/web-package/web
          if-no-files-found: error
  python-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build native CPython wheel
        run: python -m pip wheel . --no-deps --wheel-dir out/wheels
      - name: Install wheel and check binding contracts without opening a window
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem out/wheels/minvex-*.whl).FullName
          python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python python/tests/test_binding.py --fixtures examples/assets
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Minvex-Python-${{ runner.os }}-${{ runner.arch }}-cp312
          path: out/wheels/minvex-*.whl
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B out/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build C++ and HLSL/Metal shaders
        run: cmake --build out/ci --config ${{ matrix.configuration }} --parallel
      - name: CPU regression tests (desktop smoke is opt-in)
        run: ctest --test-dir out/ci --build-config ${{ matrix.configuration }} --output-on-failure
      - name: Install, relocate and verify an independent SDK consumer (Debug)
        if: matrix.configuration == 'Debug'
        run: cmake -DBUILD_DIR=out/ci -DCONFIG=${{ matrix.configuration }} -P cmake/VerifySdk.cmake
      - name: Package, checksum, extract and verify the actual SDK archive (Release)
        if: matrix.configuration == 'Release'
        run: cmake -DBUILD_DIR=out/ci -DCONFIG=Release -DPACKAGE=ON -P cmake/VerifySdk.cmake
      - name: Retain SDK archives and checksums (Release only)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Minvex-SDK-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/ci/sdk-check-*/packages/*.zip
            out/ci/sdk-check-*/packages/*.tar.gz
            out/ci/sdk-check-*/packages/*.sha256
          if-no-files-found: error
      - name: Validate benchmark and AI evaluation tools (Windows Release only)
        if: runner.os == 'Windows' && matrix.configuration == 'Release'
        shell: pwsh
        run: ./tests/Release/ToolChecks.ps1 -OutputRoot out/tool-checks
